version: "3.8"

services:
  mediator:
    build: .
    container_name: ihris-dhis2-mediator
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    networks:
      - openhim-net
    volumes:
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  openhim-net:
    external: true
    name: openhim-common-main_openhim
